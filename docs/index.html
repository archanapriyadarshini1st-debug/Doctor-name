k","Metered parking on Wimpole Street (limited)"]},Cm=[{label:"About",href:"/about"},{label:"Specialties",href:"/specialties"},{label:"Your visit",href:"/your-visit"},{label:"Clinic",href:"/clinic"},{label:"FAQ",href:"/faq"}],fr={eyebrow:"Private cardiology practice · Marylebone",headlineLines:["Heart care,","considered","unhurried."],copy:"Longer appointments, clear explanations, and a plan you understand. Dr. Navarro combines eighteen years of consultant experience with the time to listen properly.",facts:[{label:"Specialty",value:"Cardiology"},{label:"Experience",value:"18 years"},{label:"Location",value:"Marylebone, W1"},{label:"Next availability",value:"This week"}]},W6=[{value:18,suffix:"",label:"Years as a consultant",note:"verify"},{value:60,suffix:"min",label:"First consultation length"},{value:4,suffix:"",label:"Areas of focus"},{value:48,suffix:"h",label:"Typical results turnaround"}],il={eyebrow:"About the doctor",headline:"Medicine practised at a human pace.",intro:"Elena trained in London and Boston before returning to build a practice around one conviction: patients make better decisions when they are given time and the truth.",paragraphs:["Her clinical interests span preventive cardiology, the assessment of chest pain and palpitations, and the long-term care of people living with heart conditions. She works closely with a small network of imaging specialists and surgeons when further intervention is needed.","Consultations are never rushed. Each new patient is given a full hour, a written summary within 48 hours, and a direct line to the clinic for questions that arise afterwards."],philosophy:[{k:"Listen first",v:"The history tells you most of what you need to know."},{k:"Explain plainly",v:"No jargon without a translation."},{k:"Decide together",v:"You hold the final say on your own care."}],credentials:["MD, [University]","[Fellowship or Board Certification]","[Professional membership]","[Hospital affiliation]"]},ma=[{id:"preventive",index:"01",title:"Preventive cardiology",short:"Understanding your risk before it becomes a problem.",body:"A structured review of blood pressure, cholesterol, family history and lifestyle, followed by a realistic plan. For people who want to stay well, not just react when something goes wrong.",image:Sg,imageAlt:"A doctor's hands gently holding a patient's hand across a desk.",points:["Cardiovascular risk assessment","Blood pressure management","Lipid clinics"]},{id:"symptoms",index:"02",title:"Chest pain & palpitations",short:"Careful assessment when something doesn't feel right.",body:"Symptoms are taken seriously and investigated efficiently. Most patients receive an ECG and echocardiogram at the first visit, with a clear explanation of what was found and what happens next.",image:Rp,imageAlt:"A calm consultation room with an echocardiogram machine.",points:["Same-visit ECG and echo","Ambulatory monitoring","Rapid access pathways"]},{id:"diagnostics",index:"03",title:"Cardiac diagnostics",short:"Modern imaging, interpreted in person.",body:"Echocardiography, 24-hour and 7-day monitoring, exercise testing and CT coronary angiography via partner imaging centres. Results are reviewed with you rather than sent in a letter.",image:jp,imageAlt:"A stethoscope resting on an ECG printout on an oak desk.",points:["Echocardiography","Holter & event monitoring","CT coronary angiography"]},{id:"longterm",index:"04",title:"Long-term heart care",short:"Steady, continuous care for established conditions.",body:"For patients living with heart failure, valve disease, arrhythmia or after a cardiac event. Regular reviews, medication optimisation, and coordination with your GP and any other specialists.",image:Xg,imageAlt:"A serene clinic corridor with soft daylight.",points:["Heart failure follow-up","Valve disease surveillance","Post-event rehabilitation"]}],Pg=[{step:"01",title:"Book",body:"Request an appointment online or by phone. We'll confirm within one working day and send a short pre-vi
